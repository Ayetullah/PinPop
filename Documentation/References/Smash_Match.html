<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Smash Match</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap">
<style>
  /* Layout: full-screen 3D stage on top, fixed slot tray docked at the bottom. Single bright "toy box" look by design. */
  :root {
    --sky-top: #5aa9ec;
    --sky-bot: #e3f3ff;
    --ink: #1c2747;
    --panel: #ffffff;
    --muted: #5d6a8c;
    --accent: #ff6a3d;
    --accent-ink: #ffffff;
    --tray: #232d4b;
    --slot: #33406a;
    --danger: #ff3b4e;
    --gold: #ffc22e;
    --font-display: "Lilita One", "Arial Rounded MT Bold", system-ui, sans-serif;
    --font-body: "Nunito", ui-rounded, system-ui, sans-serif;
    color-scheme: light;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background:
      radial-gradient(circle at 78% 12%, rgba(255,250,220,.9) 0, rgba(255,245,200,.35) 9%, rgba(255,255,255,0) 26%),
      linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bot) 72%);
    color: var(--ink);
    font-family: var(--font-body);
    overflow: hidden;
    -webkit-user-select: none; user-select: none;
    touch-action: none;
  }
  #app { height: 100%; display: flex; flex-direction: column; }
  #stage { position: relative; flex: 1; min-height: 0; }
  #c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; }

  .hud {
    position: absolute; top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 12px 16px; pointer-events: none;
  }
  .hud > * { pointer-events: auto; }
  .stats { display: flex; gap: 8px; align-items: center; }
  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--panel); color: var(--ink);
    border-radius: 999px; padding: 6px 12px;
    font-weight: 800; font-size: 14px;
    box-shadow: 0 3px 0 rgba(28,39,71,.18);
    font-variant-numeric: tabular-nums;
    border: 0; transition: background .2s, color .2s;
  }
  .pill b { display: inline-block; font-family: var(--font-display); font-weight: 400; font-size: 18px; letter-spacing: .02em; }
  .pill .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .pill.low { background: #ffe1e5; color: #b3132a; }
  .ico { width: 14px; height: 14px; display: inline-block; }
  .ico.ball { border-radius: 50%; background: radial-gradient(circle at 35% 35%, #9aa3b8, #2b2f3a 70%); }
  .ico.cube { border-radius: 3px; background: linear-gradient(135deg, #ff7a59, #f0524f); }
  .btn { cursor: pointer; font-family: var(--font-body); }
  .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(28,39,71,.18); }
  .btn:focus-visible, button:focus-visible, select:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .bump { animation: bump .32s ease-out; }
  @keyframes bump { 40% { transform: scale(1.4); } }

  .chips { flex-basis: 100%; display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    display: inline-flex; align-items: center; gap: 5px;
    background: rgba(255,255,255,.88); border-radius: 999px; padding: 3px 10px 3px 4px;
    font-family: var(--font-display); font-size: 15px; color: var(--ink);
    font-variant-numeric: tabular-nums;
    box-shadow: 0 2px 0 rgba(28,39,71,.15);
    transition: opacity .3s, transform .3s;
  }
  .chip i {
    width: 18px; height: 18px; border-radius: 5px; background: var(--c);
    box-shadow: inset 0 -2px 0 rgba(0,0,0,.2), inset 0 1px 0 rgba(255,255,255,.5);
  }
  .chip.done { opacity: .35; transform: scale(.9); }
  #hint {
    position: absolute; left: 50%; top: 100px; transform: translateX(-50%);
    background: rgba(28,39,71,.78); color: #fff;
    padding: 8px 14px; border-radius: 12px; font-size: 13px; font-weight: 700;
    text-align: center; max-width: calc(100% - 32px); width: max-content;
    pointer-events: none; transition: opacity .4s;
  }
  #hint.gone { opacity: 0; }

  #banner {
    position: absolute; left: 0; right: 0; top: 34%;
    text-align: center; pointer-events: none; color: #fff; opacity: 0;
    font-family: var(--font-display);
    text-shadow: 0 4px 0 rgba(28,39,71,.35), 0 10px 24px rgba(28,39,71,.25);
  }
  #banner small { display: block; font-size: 15px; letter-spacing: .24em; text-transform: uppercase; }
  #banner strong { display: block; font-weight: 400; font-size: clamp(38px, 9vw, 64px); line-height: 1.05; }
  #banner.show { animation: banner 1.6s ease forwards; }
  @keyframes banner {
    0% { opacity: 0; transform: scale(.6); }
    14% { opacity: 1; transform: scale(1.08); }
    24% { transform: scale(1); }
    75% { opacity: 1; transform: none; }
    100% { opacity: 0; transform: translateY(-24px); }
  }

  .dock {
    flex: none; padding: 10px 16px calc(14px + env(safe-area-inset-bottom, 0px));
    display: flex; flex-direction: column; align-items: center; gap: 6px;
  }
  .dock-head {
    width: 100%; max-width: 640px; display: flex; justify-content: space-between; align-items: baseline;
    font-size: 12px; text-transform: uppercase; letter-spacing: .1em; font-weight: 800; color: var(--ink);
  }
  .dock-head b { display: inline-block; font-family: var(--font-display); font-weight: 400; font-size: 18px; letter-spacing: .04em; font-variant-numeric: tabular-nums; transition: color .2s; }
  .dock-head b.hot { color: var(--danger); }
  .tray {
    position: relative; width: 100%; max-width: 640px;
    background: linear-gradient(180deg, #2b3659, var(--tray));
    border-radius: 18px; padding: 10px;
    box-shadow: 0 6px 0 rgba(28,39,71,.35), inset 0 2px 0 rgba(255,255,255,.1);
    box-sizing: border-box;
  }
  .tray.danger { animation: danger 0.9s ease-in-out infinite; }
  .tray.shake { animation: shake .45s; }
  @keyframes danger {
    0%,100% { box-shadow: 0 6px 0 rgba(28,39,71,.35), 0 0 0 0 rgba(255,59,78,0); }
    50% { box-shadow: 0 6px 0 rgba(28,39,71,.35), 0 0 0 4px var(--danger); }
  }
  @keyframes shake {
    15% { transform: translateX(-9px); } 35% { transform: translateX(8px); }
    55% { transform: translateX(-6px); } 75% { transform: translateX(4px); } 90% { transform: translateX(-2px); }
  }
  .slots { display: grid; gap: 5px; }
  .slot { aspect-ratio: 1; background: var(--slot); border-radius: 22%; box-shadow: inset 0 3px 0 rgba(0,0,0,.28); }
  .tiles { position: absolute; inset: 0; pointer-events: none; }
  .tile {
    position: absolute; left: 0; top: 0; opacity: 0;
    transition: transform .22s cubic-bezier(.3,1.4,.5,1);
  }
  .tile.in { opacity: 1; }
  .tile i, .fly {
    display: block; position: relative; width: 100%; height: 100%; border-radius: 22%;
    background: linear-gradient(180deg, color-mix(in srgb, var(--c) 70%, white) 0%, var(--c) 42%, color-mix(in srgb, var(--c) 82%, black) 100%);
    box-shadow: inset 0 -4px 0 rgba(0,0,0,.2), inset 0 2px 0 rgba(255,255,255,.55), 0 3px 6px rgba(0,0,0,.28);
  }
  .tile i::after, .fly::after {
    content: ""; position: absolute; left: 17%; top: 13%; width: 32%; height: 15%;
    border-radius: 999px; background: rgba(255,255,255,.5);
  }
  .tile.in i { animation: land .3s cubic-bezier(.3,1.6,.5,1); }
  .tile.blast i { animation: blast .26s ease-in forwards; }
  @keyframes land { 0% { transform: scale(1.35, .7); } 55% { transform: scale(.9, 1.12); } 100% { transform: scale(1); } }
  @keyframes blast {
    0% { transform: scale(1); }
    45% { transform: scale(1.35); filter: brightness(1.8); }
    100% { transform: scale(0); opacity: 0; }
  }
  #flyLayer { position: fixed; inset: 0; pointer-events: none; z-index: 30; overflow: hidden; }
  .fly { position: fixed; left: 0; top: 0; width: 40px; height: 40px; }
  .spark {
    position: fixed; width: 9px; height: 9px; border-radius: 50%; background: var(--c);
    box-shadow: 0 0 8px var(--c);
    animation: spark .5s ease-out forwards;
  }
  @keyframes spark {
    from { transform: translate(0,0) scale(1); opacity: 1; }
    to { transform: translate(var(--dx), var(--dy)) scale(.15); opacity: 0; }
  }
  .ring {
    position: fixed; width: 24px; height: 24px; margin: -12px 0 0 -12px; border-radius: 50%;
    border: 4px solid var(--c); box-sizing: border-box;
    animation: ring .45s ease-out forwards;
  }
  @keyframes ring { from { transform: scale(.5); opacity: 1; } to { transform: scale(4.2); opacity: 0; } }
  .float-text {
    position: fixed; transform: translate(-50%, -50%);
    font-family: var(--font-display); font-size: 26px; color: #fff; white-space: nowrap;
    text-shadow: 0 3px 0 var(--c), 0 6px 14px rgba(0,0,0,.25);
    animation: floatUp 1s ease-out forwards;
  }
  .float-text.big { font-size: 34px; }
  @keyframes floatUp {
    0% { opacity: 0; transform: translate(-50%, -30%) scale(.5); }
    18% { opacity: 1; transform: translate(-50%, -50%) scale(1.18); }
    30% { transform: translate(-50%, -55%) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -190%) scale(1); }
  }
  .confetti {
    position: fixed; top: -24px; height: 14px; background: var(--c); border-radius: 2px;
    animation: fall var(--d) cubic-bezier(.25,.6,.4,1) forwards;
  }
  @keyframes fall { to { transform: translate(var(--dx), 110vh) rotate(var(--r)); } }
  #vignette {
    position: fixed; inset: 0; pointer-events: none; z-index: 20; opacity: 0; transition: opacity .35s;
    background: radial-gradient(ellipse at center, rgba(255,40,70,0) 52%, rgba(255,40,70,.4) 100%);
  }
  #vignette.on { opacity: 1; animation: vig 1s ease-in-out infinite; }
  @keyframes vig { 50% { opacity: .5; } }

  .backdrop {
    position: fixed; inset: 0; z-index: 40;
    background: rgba(20,28,56,.5);
    display: grid; place-items: center; padding-inline: 16px;
    animation: fade .25s ease-out;
  }
  @keyframes fade { from { opacity: 0; } }
  .card {
    background: var(--panel); color: var(--ink);
    border-radius: 22px; padding: 24px; width: 100%; max-width: 340px; box-sizing: border-box;
    box-shadow: 0 8px 0 rgba(28,39,71,.25);
    display: flex; flex-direction: column; gap: 14px; text-align: center;
    animation: pop .38s cubic-bezier(.3,1.5,.5,1);
  }
  @keyframes pop { from { transform: scale(.82) translateY(16px); opacity: 0; } }
  .card h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 34px; letter-spacing: .02em; text-wrap: balance; }
  .card p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.45; }
  .card .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .stars { display: flex; justify-content: center; align-items: flex-end; gap: 8px; }
  .stars span {
    width: 48px; height: 48px; background: #dfe5f1;
    clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
  }
  .stars span:nth-child(2) { width: 60px; height: 60px; }
  .stars span.on { background: linear-gradient(180deg, #ffe066, var(--gold) 55%, #f39c12); animation: starpop .42s cubic-bezier(.3,1.7,.5,1); }
  @keyframes starpop { from { transform: scale(0) rotate(-40deg); } }
  .cta {
    font-family: var(--font-display); font-size: 18px; letter-spacing: .03em;
    border: 0; border-radius: 14px; padding: 12px 20px; cursor: pointer;
    background: var(--accent); color: var(--accent-ink);
    box-shadow: 0 4px 0 #c94a22;
  }
  .cta:active { transform: translateY(2px); box-shadow: 0 2px 0 #c94a22; }
  .cta.ghost { background: #e9eef8; color: var(--ink); box-shadow: 0 4px 0 #c5cee0; }
  .form { display: grid; gap: 10px; text-align: left; }
  .form label { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 10px; font-weight: 800; font-size: 14px; }
  .form select {
    font: inherit; font-weight: 700; padding: 6px 8px; border-radius: 10px;
    border: 2px solid #d6ddec; background: #f5f7fc; color: var(--ink);
  }
  .note { font-size: 12px; color: var(--muted); }

  @media (prefers-reduced-motion: reduce) {
    .tile, .tray.danger, .tray.shake, #vignette.on, .card, #banner.show { transition: none; animation: none; }
    #banner.show { opacity: 0; }
  }
</style>
</head><body>

<div id="app">
  <div id="stage">
    <canvas id="c"></canvas>
    <header class="hud">
      <div class="pill"><span class="lbl">Seviye</span><b id="lvlNum">1</b><span id="lvlName">Kule</span></div>
      <div class="stats">
        <div class="pill" id="ammoPill" title="Kalan top"><span class="ico ball"></span><b id="ammo">10</b></div>
        <div class="pill" title="Platformdaki küp"><span class="ico cube"></span><b id="left">36</b></div>
        <button id="btnSettings" class="pill btn" type="button">Ayarlar</button>
      </div>
      <div class="chips" id="chips" aria-label="Platformda kalan küpler, renge göre"></div>
    </header>
    <div id="hint">Basılı tutup nişan al, bırakınca ateşle. Platformdan düşen küpler slota gider.</div>
    <div id="banner"><small id="bannerSub">Seviye 1</small><strong id="bannerName">Kule</strong></div>
  </div>
  <footer class="dock">
    <div class="dock-head"><span>Slotlar</span><b id="slotCount">0/10</b></div>
    <div class="tray" id="tray">
      <div class="slots" id="slots"></div>
      <div class="tiles" id="tiles"></div>
    </div>
  </footer>
</div>
<div id="vignette"></div>
<div id="flyLayer"></div>

<div class="backdrop" id="overlay" hidden>
  <div class="card">
    <div class="stars" id="ovStars"><span></span><span></span><span></span></div>
    <h2 id="ovTitle">Tamamlandı</h2>
    <p id="ovText"></p>
    <div class="row">
      <button class="cta ghost" id="ovRetry" type="button">Tekrar dene</button>
      <button class="cta" id="ovNext" type="button">Sonraki seviye</button>
    </div>
  </div>
</div>

<div class="backdrop" id="settings" hidden>
  <div class="card">
    <h2>Ayarlar</h2>
    <form class="form" id="settingsForm">
      <label for="setLevel">Seviye <select id="setLevel"></select></label>
      <label for="setSlots">Slot sayısı
        <select id="setSlots">
          <option value="7">7</option><option value="8">8</option>
          <option value="10" selected>10</option><option value="12">12</option>
        </select>
      </label>
      <label for="setBall">Top ağırlığı
        <select id="setBall">
          <option value="hafif">Hafif</option><option value="orta" selected>Orta</option><option value="agir">Ağır</option>
        </select>
      </label>
      <label for="setAmmo">Top hakkı
        <select id="setAmmo">
          <option value="limitli" selected>Limitli</option><option value="sinirsiz">Sınırsız</option>
        </select>
      </label>
      <label for="setSound">Ses
        <select id="setSound"><option value="on" selected>Açık</option><option value="off">Kapalı</option></select>
      </label>
      <label for="setShake">Ekran sarsıntısı
        <select id="setShake"><option value="on" selected>Açık</option><option value="off">Kapalı</option></select>
      </label>
      <span class="note">Uygula'ya basınca seçili seviye baştan başlar.</span>
      <div class="row">
        <button class="cta ghost" id="setCancel" type="button">Kapat</button>
        <button class="cta" type="submit">Uygula</button>
      </div>
    </form>
  </div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",

</script>
<script type="module">
import * as THREE from 'three';
import * as CANNON from 'cannon-es';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

// ---------- config ----------
const G = -20;
const PALETTE = ['#f0524f', '#3b82f6', '#facc15', '#22c55e', '#a855f7', '#fb923c'];
const BALLS = { hafif: { mass: 1.5, r: 0.35 }, orta: { mass: 3, r: 0.42 }, agir: { mass: 7, r: 0.5 } };
const PLATFORM = { hx: 6.2, hz: 4.7 };          // top surface is y = 0
const COLLECT_Y = -0.8;                          // cube counts as "smashed off" below this
const settings = { slots: 10, ball: 'orta', ammo: 'limitli', sound: true, shake: true };
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const buzz = p => { try { navigator.vibrate?.(p); } catch {} };

// Structures are one cube deep and built out of triples, so every color is readable from the cannon.
// Back rows are staggered against the front, and stand taller or on stone plinths to show over it.
// mode: 'grouped' = each triple is one color, 'pairs' = colors shuffled inside neighbouring triple pairs,
//       'mixed' = shuffled across the whole level (still fully visible, just harder to plan)
const LEVELS = [
  { name: 'Sütunlar', ammo: 30, colors: 4, mode: 'grouped', build: b => {
      [-4.5, -1.5, 1.5, 4.5].forEach(x => b.col(x, 2, 3));
      [-3, 0, 3].forEach(x => b.col(x, -1.5, 6));
    } },
  { name: 'Duvarlar', ammo: 40, colors: 5, mode: 'grouped', build: b => {
      b.wall(-3.5, 2.5, 3, 3); b.wall(3.5, 2.5, 3, 3);
      b.wall(0, -1.5, 6, 4);
    } },
  { name: 'Kaideler', ammo: 36, colors: 5, mode: 'grouped', build: b => {
      [-5, 5].forEach(x => b.col(x, 3, 3));
      [-1.5, 1.5].forEach(x => b.col(x, 1, 3));
      const yl = b.plinth(-3.5, -2.5, 3.4, 1.6, 1.2), yr = b.plinth(3.5, -2.5, 3.4, 1.6, 1.2);
      b.wall(-3.5, -2.5, 3, 3, yl); b.wall(3.5, -2.5, 3, 3, yr);
      b.col(0, -3.5, 6);
    } },
  { name: 'Arena', ammo: 40, colors: 6, mode: 'pairs', build: b => {
      [-5, -2.5, 0, 2.5, 5].forEach(x => b.col(x, 3, 3));
      [-4, 4].forEach(x => b.col(x, 0.3, 3));
      const y = b.plinth(0, -3.4, 11.6, 1.6, 1.2);
      [-5, -2.5, 0, 2.5, 5].forEach(x => b.col(x, -3.4, 3, y));
    } },
  { name: 'Kale', ammo: 55, colors: 6, mode: 'mixed', build: b => {
      const y = b.plinth(0, -3.3, 9.6, 1.6, 1.4);
      b.wall(0, -3.3, 9, 3, y);
      [-5.2, 5.2].forEach(x => b.col(x, -0.8, 6));
      b.wall(-2.5, 2, 3, 2); b.wall(2.5, 2, 3, 2);
      b.col(0, 3, 3);
    } },
];

function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; }

function buildLevel(def) {
  const groups = [], plinths = [];
  const b = {
    col(x, z, h, base = 0) {
      for (let j = 0; j + 3 <= h; j += 3) groups.push([0, 1, 2].map(k => ({ x, y: base + 0.5 + j + k, z })));
    },
    wall(cx, cz, len, h, base = 0) {
      for (let j = 0; j < h; j++) for (let i = 0; i + 3 <= len; i += 3)
        groups.push([0, 1, 2].map(k => ({ x: cx + i + k - (len - 1) / 2, y: base + 0.5 + j, z: cz })));
    },
    plinth(x, z, w, d, h) { plinths.push({ x, z, w, d, h }); return h; },
  };
  def.build(b);
  // one color per triple keeps every color count a multiple of 3
  const colors = shuffle(groups.map((_, i) => i % def.colors)).flatMap(c => [c, c, c]);
  if (def.mode === 'mixed') shuffle(colors);
  if (def.mode === 'pairs') for (let i = 0; i < colors.length; i += 6) {
    shuffle(colors.slice(i, i + 6)).forEach((c, k) => { colors[i + k] = c; });
  }
  return { cubes: groups.flat().map((p, i) => ({ ...p, color: colors[i] })), plinths };
}

// ---------- sound ----------
// Everything is synthesized: no audio files. Master bus -> compressor, with a shared reverb send.
const sfx = (() => {
  let ctx = null, master, verb, noiseBuf;
  const lastAt = {};
  const gate = (key, ms) => { const n = performance.now(); if (lastAt[key] && n - lastAt[key] < ms) return false; lastAt[key] = n; return true; };
  const semi = n => Math.pow(2, n / 12);
  const PENTA = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24, 26, 28];

  function init() {
    try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch { ctx = null; return; }
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -16; comp.knee.value = 12; comp.ratio.value = 5; comp.attack.value = 0.003; comp.release.value = 0.15;
    master = ctx.createGain(); master.gain.value = 0.9;
    master.connect(comp); comp.connect(ctx.destination);
    const len = ctx.sampleRate * 1.4, ir = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let ch = 0; ch < 2; ch++) { const d = ir.getChannelData(ch); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3.2); }
    verb = ctx.createConvolver(); verb.buffer = ir; verb.connect(master);
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
    const nd = noiseBuf.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
  }
  function route(node, wet) {
    node.connect(master);
    if (wet) { const g = ctx.createGain(); g.gain.value = wet; node.connect(g); g.connect(verb); }
  }
  function env(g, t0, vol, attack, dur) {
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol), t0 + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  }
  function osc({ type = 'sine', f, f2, delay = 0, dur = 0.15, vol = 0.1, attack = 0.004, wet = 0 }) {
    const t0 = ctx.currentTime + delay, n = ctx.createOscillator(), g = ctx.createGain();
    n.type = type; n.frequency.setValueAtTime(f, t0);
    if (f2) n.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
    env(g, t0, vol, attack, dur); n.connect(g); route(g, wet);
    n.start(t0); n.stop(t0 + dur + 0.05);
  }
  function noise({ filter = 'bandpass', f = 1000, f2, q = 1, delay = 0, dur = 0.2, vol = 0.1, attack = 0.004, wet = 0 }) {
    const t0 = ctx.currentTime + delay, s = ctx.createBufferSource();
    s.buffer = noiseBuf; s.playbackRate.value = 0.8 + Math.random() * 0.4;
    const fl = ctx.createBiquadFilter(); fl.type = filter; fl.Q.value = q;
    fl.frequency.setValueAtTime(f, t0); if (f2) fl.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
    const g = ctx.createGain(); env(g, t0, vol, attack, dur);
    s.connect(fl); fl.connect(g); route(g, wet);
    s.start(t0, Math.random() * 0.5); s.stop(t0 + dur + 0.05);
  }
  const ok = () => ctx && settings.sound && ctx.state === 'running';

  return {
    unlock() { if (!ctx) init(); if (ctx && ctx.state === 'suspended') ctx.resume(); },
    fire() { if (!ok()) return;
      osc({ f: 150, f2: 38, dur: 0.38, vol: 0.55, attack: 0.002 });
      noise({ filter: 'lowpass', f: 2400, f2: 180, dur: 0.32, vol: 0.4, q: 0.7, wet: 0.25 });
      osc({ type: 'square', f: 1400, f2: 300, dur: 0.035, vol: 0.05 });
    },
    smash(v) { if (!ok() || !gate('smash', 60)) return; const k = Math.min(1, v / 18);
      osc({ f: 120, f2: 55, dur: 0.2, vol: 0.22 + 0.25 * k });
      noise({ filter: 'bandpass', f: 1700, f2: 500, q: 1.2, dur: 0.16, vol: 0.16 + 0.2 * k, wet: 0.2 });
    },
    knock(v) { if (!ok() || !gate('knock', 28)) return;
      const k = Math.max(0, Math.min(1, (v - 2) / 10)), f = 520 + Math.random() * 380;
      osc({ type: 'triangle', f, f2: f * 0.82, dur: 0.06 + 0.04 * k, vol: 0.04 + 0.12 * k });
      noise({ filter: 'bandpass', f: 2600 + Math.random() * 1500, q: 4, dur: 0.035, vol: 0.04 + 0.1 * k });
    },
    thud(v) { if (!ok() || !gate('thud', 90)) return;
      osc({ f: 90, f2: 45, dur: 0.16, vol: Math.min(0.35, v * 0.03) });

    },
    spawn() { if (!ok() || !gate('spawn', 45)) return; const f = 900 + Math.random() * 500; osc({ f, f2: f * 1.5, dur: 0.06, vol: 0.035 }); },
    whoosh() { if (!ok() || !gate('whoosh', 50)) return; noise({ filter: 'bandpass', f: 500, f2: 2600, q: 1.4, dur: 0.24, vol: 0.12, attack: 0.06 }); },
    land(n) { if (!ok()) return; const f = 523.25 * semi(PENTA[Math.min(n, PENTA.length - 1)]);

    },
    match(combo) { if (!ok()) return; const base = 659.25 * semi(Math.min(combo - 1, 6) * 2);
      [0, 4, 7, 12].forEach((s, i) => osc({ type: 'triangle', f: base * semi(s), dur: 0.36, vol: 0.09, delay: i * 0.035, wet: 0.4 }));
      for (let i = 0; i < 5; i++) osc({ f: 2200 + Math.random() * 2400, dur: 0.12, vol: 0.025, delay: 0.08 + i * 0.04, wet: 0.6 });

    },
    warn() { if (!ok()) return; osc({ type: 'square', f: 220, dur: 0.12, vol: 0.05 }); osc({ type: 'square', f: 185, dur: 0.16, vol: 0.05, delay: 0.14 }); },
    star(i) { if (!ok()) return; const f = 784 * semi(i * 4);

    win() { if (!ok()) return;

    },
    click() { if (!ok()) return; osc({ f: 880, f2: 660, dur: 0.05, vol: 0.06 }); },
  };
})();

function spawnDebris(pos, color, n, power = 6) {

function updateParticles(dt) {
  for (let i = puffs.length - 1; i >= 0; i--) {
    const p = puffs[i]; p.age += dt;
    const k = p.age / p.life;
    p.s.position.addScaledVector(p.vel, dt); p.vel.multiplyScalar(Math.exp(-dt * 4));
    p.s.scale.setScalar(p.size * (1 + p.grow * (1 - Math.pow(1 - Math.min(1, k), 2))));
    p.s.material.opacity = p.opacity * (1 - k);
    if (k >= 1) { scene.remove(p.s); p.s.material.dispose(); puffs.splice(i, 1); }
  }
  for (let i = debris.length - 1; i >= 0; i--) {
    const d = debris[i]; d.age += dt;
    d.vel.y += G * dt;
    d.m.position.addScaledVector(d.vel, dt);
    d.m.rotation.x += d.spin.x * dt; d.m.rotation.y += d.spin.y * dt; d.m.rotation.z += d.spin.z * dt;
    if (d.m.position.y < 0.12 && Math.abs(d.m.position.x) < PLATFORM.hx && Math.abs(d.m.position.z) < PLATFORM.hz && d.vel.y < 0) {
      d.m.position.y = 0.12; d.vel.y *= -0.35; d.vel.x *= 0.6; d.vel.z *= 0.6;
    }
    const k = d.age / d.life;
    d.m.scale.setScalar(k > 0.7 ? Math.max(0.01, (1 - k) / 0.3) : 1);
    if (k >= 1) { scene.remove(d.m); debris.splice(i, 1); }
  }
}

function loadLevel(i) {

    const mesh = new THREE.Mesh(new RoundedBoxGeometry(p.w, p.h, p.d, 2, 0.12), plinthMat);
    mesh.position.set(p.x, p.h / 2, p.z);

    const body = new CANNON.Body({ mass: 0, shape: new CANNON.Box(new CANNON.Vec3(p.w / 2, p.h / 2, p.d / 2)), position: new CANNON.Vec3(p.x, p.h / 2, p.z) });
    world.addBody(body); scene.add(mesh);

  }
  for (const p of layout.cubes) {
    const mesh = new THREE.Mesh(cubeGeo, cubeMats[p.color].clone());
    mesh.castShadow = true; mesh.receiveShadow = true;
    mesh.scale.setScalar(0.001);
    const body = new CANNON.Body({

      position: new CANNON.Vec3(p.x, p.y, p.z),
      linearDamping: 0.04, angularDamping: 0.08, sleepSpeedLimit: 0.2, sleepTimeLimit: 0.5,
    });
    world.addBody(body); body.sleep();
    scene.add(mesh);
    const delay = reduceMotion ? 0 : (p.y - 0.5) * 0.11 + (Math.abs(p.x) + Math.abs(p.z)) * 0.025 + Math.random() * 0.08;
    introEnd = Math.max(introEnd, delay + 0.5);
    const cube = { mesh, body, color: p.color, collected: false, flash: 0, delay, appeared: false };
    body.cube = cube;
    body.addEventListener('collide', e => {
      const v = Math.abs(e.contact.getImpactVelocityAlongNormal());
      if (v > 2.5 && state !== 'intro') sfx.knock(v);
    });
    mesh.userData.cube = cube;
    cubes.push(cube);

  $('overlay').hidden = true;
  $('hint').classList.toggle('gone', i > 0);

  const label = $('slotCount');
  label.textContent = `${live}/${settings.slots}`;
  const danger = state === 'playing' && live >= settings.slots - 2;
  label.classList.toggle('hot', danger);
  trayEl.classList.toggle('danger', danger);
  $('vignette').classList.toggle('on', danger);
  if (danger && !wasDanger) { sfx.warn(); buzz(40); }
  wasDanger = danger;
}
function buildSlots() {
  slotsEl.style.gridTemplateColumns = `repeat(${settings.slots}, 1fr)`;
  slotsEl.innerHTML = '<div class="slot"></div>'.repeat(settings.slots);
}
function slotPos(i) {
  const cells = slotsEl.children, c0 = cells[0];
  const step = cells.length > 1 ? cells[1].offsetLeft - c0.offsetLeft : c0.offsetWidth + 5;
  return `translate(${c0.offsetLeft + i * step}px, ${c0.offsetTop}px)`;
}
function layoutTray() {
  const c0 = slotsEl.children[0];
  if (!c0) return;
  const w = c0.offsetWidth;
  tray.forEach((t, i) => {
    t.el.style.width = t.el.style.height = w + 'px';
    if (!t.blasting) t.el.style.transform = slotPos(i);
  });
}

function project(v3) {
  const v = new THREE.Vector3(v3.x, v3.y, v3.z).project(camera);
  const r = canvas.getBoundingClientRect();
  return { x: r.left + (v.x + 1) / 2 * r.width, y: r.top + (1 - v.y) / 2 * r.height };
}

function collect(cube) {
  cube.collected = true;
  const at = new THREE.Vector3().copy(cube.body.position);
  world.removeBody(cube.body);
  scene.remove(cube.mesh);
  cube.mesh.material.dispose();
  cubesLeft--;
  updateHud(); bump($('left'));
  wakeAll();
  if (state !== 'playing') return;

  puff(at, { size: 1.1, life: 0.45, opacity: 0.9, grow: 1.6 });
  puff(at, { size: 0.8, color: new THREE.Color(PALETTE[cube.color]), life: 0.35, opacity: 0.7, grow: 1.2 });
  sfx.whoosh();
  idle = 0;
  const color = cube.color;
  // tile slides in right after the last tile of the same color (classic triple-match sorting)
  let idx = tray.length;
  for (let i = tray.length - 1; i >= 0; i--) if (tray[i].color === color && !tray[i].matched) { idx = i + 1; break; }
  const el = document.createElement('div');
  el.className = 'tile';
  el.style.setProperty('--c', PALETTE[color]);
  el.innerHTML = '<i></i>';
  el.style.transition = 'none';
  tilesEl.appendChild(el);
  const item = { color, el, arrived: false, matched: false, group: 0 };
  tray.splice(idx, 0, item);

  const same = tray.filter(t => t.color === color && !t.matched);
  if (same.length >= 3) { const g = ++groupSeq; same.slice(0, 3).forEach(t => { t.matched = true; t.group = g; }); }
  layoutTray();
  void el.offsetWidth;
  el.style.transition = '';

  const sp = project(at);
  const fly = document.createElement('div');
  fly.className = 'fly';
  fly.style.setProperty('--c', PALETTE[color]);
  flyLayer.appendChild(fly);
  flights.push({ item, el: fly, x0: sp.x, y0: sp.y, t: 0, spin: (Math.random() - 0.5) * 540, lift: 70 + Math.random() * 50 });

  updateTrayCount();
  if (liveCount() >= settings.slots) lose('full');
}

function updateFlights(dt) {
  for (let i = flights.length - 1; i >= 0; i--) {
    const f = flights[i];
    f.t += dt / 0.48;
    const p = Math.min(1, f.t);
    const e = p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
    const r = f.item.el.getBoundingClientRect();
    const size = (38 + (r.width - 38) * e) * (1 + Math.sin(Math.PI * p) * 0.25);
    const x = f.x0 + (r.left + r.width / 2 - f.x0) * e;
    const y = f.y0 + (r.top + r.height / 2 - f.y0) * e - Math.sin(Math.PI * p) * f.lift;
    f.el.style.width = f.el.style.height = size + 'px';
    f.el.style.transform = `translate(${x - size / 2}px, ${y - size / 2}px) rotate(${(1 - e) * f.spin}deg)`;
    if (p >= 1) {
      f.el.remove();
      flights.splice(i, 1);
      f.item.arrived = true;
      f.item.el.classList.add('in');
      sfx.land(Math.max(0, tray.indexOf(f.item)));
      checkBlasts();
    }
  }
}

function checkBlasts() {
  const groups = new Map();
  for (const t of tray) if (t.matched) { if (!groups.has(t.group)) groups.set(t.group, []); groups.get(t.group).push(t); }
  const token = levelToken;
  for (const items of groups.values()) {
    if (items.length < 3 || items[0].blasting || !items.every(t => t.arrived)) continue;
    const sorted = items.slice().sort((a, b) => tray.indexOf(a) - tray.indexOf(b));
    const mid = sorted[1];
    items.forEach(t => { t.blasting = true; });
    const midT = slotPos(tray.indexOf(mid));
    items.forEach(t => { t.el.style.transform = midT; });   // the three tiles snap together, then pop
    setTimeout(() => {
      if (token !== levelToken) return;
      const r = mid.el.getBoundingClientRect();
      const cx = r.left + r.width / 2, cy = r.top + r.height / 2, color = PALETTE[mid.color];
      items.forEach(t => t.el.classList.add('blast'));
      const now = performance.now();
      comboCount = now - lastMatchAt < 2200 ? comboCount + 1 : 1;
      lastMatchAt = now;
      ring(cx, cy, color);
      sparks(cx, cy, color, 10 + comboCount * 2);
      const words = ['', '', 'Güzel!', 'Harika!', 'Süper!', 'Muhteşem!'];
      floatText(cx, cy - r.height, comboCount > 1 ? `${words[Math.min(comboCount, 5)]} x${comboCount}` : '+3', color, comboCount > 1);
      sfx.match(comboCount);
      buzz(25);
      setTimeout(() => {
        if (token !== levelToken) return;
        items.forEach(t => { t.el.remove(); const k = tray.indexOf(t); if (k >= 0) tray.splice(k, 1); });
        layoutTray(); updateTrayCount(); checkWin();
      }, 240);
    }, 130);
  }
}

function sparks(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const s = document.createElement('div');
    s.className = 'spark';
    const a = Math.random() * Math.PI * 2, d = 30 + Math.random() * 45;
    s.style.cssText = `left:${x - 4}px;top:${y - 4}px;--c:${color};--dx:${Math.cos(a) * d}px;--dy:${Math.sin(a) * d - 14}px`;
    flyLayer.appendChild(s);
    setTimeout(() => s.remove(), 550);
  }
}
function ring(x, y, color) {
  const el = document.createElement('div');
  el.className = 'ring';
  el.style.cssText = `left:${x}px;top:${y}px;--c:${color}`;
  flyLayer.appendChild(el);
  setTimeout(() => el.remove(), 500);
}
function floatText(x, y, text, color, big) {
  const el = document.createElement('div');
  el.className = 'float-text' + (big ? ' big' : '');
  el.textContent = text;
  el.style.cssText = `left:${x}px;top:${y}px;--c:${color}`;
  flyLayer.appendChild(el);
  setTimeout(() => el.remove(), 1050);
}
function confetti() {
  if (reduceMotion) return;
  for (let i = 0; i < 80; i++) {
    const d = document.createElement('div');
    const dur = 1.6 + Math.random() * 1.4;
    d.className = 'confetti';
    d.style.cssText = `left:${Math.random() * innerWidth}px;width:${6 + Math.random() * 6}px;--c:${PALETTE[i % PALETTE.length]};--d:${dur}s;--dx:${(Math.random() - 0.5) * 240}px;--r:${(Math.random() - 0.5) * 1440}deg;animation-delay:${Math.random() * 0.5}s`;
    flyLayer.appendChild(d);
    setTimeout(() => d.remove(), (dur + 0.6) * 1000);
  }
}

function checkWin() {
  if (state === 'playing' && cubesLeft === 0 && tray.length === 0) {
    state = 'won';
    updateTrayCount();
    sfx.win(); confetti(); buzz([30, 40, 30]);
    const def = LEVELS[levelIndex];
    // stars measure efficiency against the number of triples, since ammo is now generous
    const triples = cubes.length / 3;
    const stars = shotsThisLevel <= triples ? 3 : shotsThisLevel <= triples * 2 ? 2 : 1;
    const last = levelIndex === LEVELS.length - 1;
    const token = levelToken;
    setTimeout(() => {
      if (token === levelToken) showOverlay('Temizlendi!', `${shotsThisLevel} atışta tüm küpleri patlattın.`, last ? 'Baştan başla' : 'Sonraki seviye', stars);
    }, 700);
  }
}

function lose(reason) {
  if (state !== 'playing') return;
  state = 'lost';
  updateTrayCount();
  sfx.fail(); shake(0.45); buzz([80, 60, 120]);
  trayEl.classList.remove('shake'); void trayEl.offsetWidth; trayEl.classList.add('shake');
  const token = levelToken;
  const text = reason === 'full'
    ? `${settings.slots} slot eşleşmeden doldu. Aynı renkleri art arda düşürmeye çalış.`
    : `Toplar bitti, platformda ${cubesLeft} küp kaldı.`;
  setTimeout(() => { if (token === levelToken) showOverlay(reason === 'full' ? 'Slotlar doldu' : 'Top kalmadı', text, null, null); }, 900);
}

function showOverlay(title, text, nextLabel, stars) {
  $('ovTitle').textContent = title;
  $('ovText').textContent = text;
  $('ovNext').hidden = !nextLabel;
  if (nextLabel) $('ovNext').textContent = nextLabel;
  const starsEl = $('ovStars');
  starsEl.hidden = stars == null;
  [...starsEl.children].forEach(s => s.classList.remove('on'));
  $('overlay').hidden = false;
  if (stars != null) {
    const token = levelToken;
    for (let i = 0; i < stars; i++) setTimeout(() => {
      if (token !== levelToken) return;
      starsEl.children[i].classList.add('on'); sfx.star(i); buzz(15);
    }, 350 + i * 280);
  }
}
$('ovRetry').onclick = () => loadLevel(levelIndex);
$('ovNext').onclick = () => loadLevel((levelIndex + 1) % LEVELS.length);

// ---------- aiming & firing ----------
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
const backPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), PLATFORM.hz);
let aiming = false, aimPoint = null, aimT = 0, dotPhase = 0;
const aimV = new THREE.Vector3();

function pick(clientX, clientY) {
  const r = canvas.getBoundingClientRect();
  ndc.set(((clientX - r.left) / r.width) * 2 - 1, -((clientY - r.top) / r.height) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  const targets = [grass, ...plinthObjs.map(p => p.mesh)];
  for (const c of cubes) if (!c.collected) targets.push(c.mesh);
  const hit = raycaster.intersectObjects(targets, false)[0];
  if (hit) return { point: hit.point.clone(), normal: hit.face ? hit.face.normal.clone().transformDirection(hit.object.matrixWorld) : new THREE.Vector3(0, 1, 0) };
  const p = new THREE.Vector3();
  if (raycaster.ray.intersectPlane(backPlane, p) && p.y > -1) return { point: p, normal: new THREE.Vector3(0, 0, 1) };
  return null;
}

function launch(to) {
  const d = new THREE.Vector3().subVectors(to, CANNON_POS);
  const t = THREE.MathUtils.clamp(d.length() / 24, 0.45, 1.1);
  return { v: new THREE.Vector3(d.x / t, (d.y - 0.5 * G * t * t) / t, d.z / t), t };
}

function updateAim(clientX, clientY) {
  const hit = pick(clientX, clientY);
  aimPoint = hit ? hit.point : null;
  reticle.visible = !!hit && (state === 'playing' || state === 'intro');
  if (!hit) { dots.visible = false; return; }
  reticle.position.copy(hit.point).addScaledVector(hit.normal, 0.03);
  reticle.lookAt(hit.point.clone().add(hit.normal));
  const { v, t } = launch(hit.point);
  aimV.copy(v); aimT = t;
  aimHelper.lookAt(CANNON_POS.clone().add(v));
  desiredQ.copy(aimHelper.quaternion);
  dots.visible = aiming;
}
function drawDots(dt) {
  if (!dots.visible) return;
  dotPhase = (dotPhase + dt * 1.6) % 1;
  const arr = dotGeo.attributes.position.array;
  for (let i = 0; i < DOTS; i++) {
    const s = 0.05 + (aimT - 0.05) * ((i + dotPhase) / DOTS);
    arr[i * 3] = CANNON_POS.x + aimV.x * s;
    arr[i * 3 + 1] = CANNON_POS.y + aimV.y * s + 0.5 * G * s * s;
    arr[i * 3 + 2] = CANNON_POS.z + aimV.z * s;
  }
  dotGeo.attributes.position.needsUpdate = true;
}

function canFire() {
  return state === 'playing' && cooldown <= 0 && (settings.ammo === 'sinirsiz' || ammo > 0);
}

function removeBall(b) {
  world.removeBody(b.body); scene.remove(b.mesh);
  b.trail.forEach(s => { scene.remove(s); s.material.dispose(); });
}

function fire(target) {
  if (!canFire()) return;
  const { v } = launch(target);
  const dir = v.clone().normalize();
  const spec = BALLS[settings.ball];
  const start = CANNON_POS.clone().addScaledVector(dir, 1.5);
  const body = new CANNON.Body({
    mass: spec.mass, shape: new CANNON.Sphere(spec.r),
    position: new CANNON.Vec3(start.x, start.y, start.z),
    linearDamping: 0.01, angularDamping: 0.3,
  });
  body.allowSleep = false;
  body.velocity.set(v.x, v.y, v.z);
  world.addBody(body);
  const mesh = new THREE.Mesh(ballGeo, ballMat);
  mesh.scale.setScalar(spec.r); mesh.castShadow = true;
  mesh.position.copy(start);
  scene.add(mesh);
  const trail = [];
  for (let i = 0; i < 9; i++) {
    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: softTex, color: 0xdfe8ff, transparent: true, opacity: 0, depthWrite: false }));
    s.position.copy(start); scene.add(s); trail.push(s);
  }
  const ball = { body, mesh, age: 0, trail, hist: [], struck: false, r: spec.r };
  body.addEventListener('collide', e => {
    wakeAll();
    const v = Math.abs(e.contact.getImpactVelocityAlongNormal());
    const cube = e.body.cube;
    const at = new THREE.Vector3().copy(body.position);
    if (cube && v > 3) {
      cube.flash = 1;
      spawnDebris(at, cube.color, Math.min(7, 2 + (v / 4 | 0)), 3 + v * 0.3);
      puff(at, { size: 0.9, life: 0.4, opacity: 0.6, grow: 1.5 });
      shake(Math.min(0.32, 0.05 + v * 0.012) * (spec.mass / 3) ** 0.5);
      sfx.smash(v);
      if (!ball.struck && v > 7) { ball.struck = true; hitStop(0.075); buzz(18); }
    } else if (e.body === ground && v > 4) {
      puff(at.setY(0.1), { size: 1.2, color: 0xe9f5d8, life: 0.5, opacity: 0.55, grow: 1.4 });
      sfx.thud(v); shake(0.06);
    }
  });
  balls.push(ball);

  // muzzle feedback
  const muzzle = CANNON_POS.clone().addScaledVector(dir, 1.6);
  puff(muzzle, { size: 1.5, color: 0xffc36b, life: 0.12, opacity: 1, grow: 0.6 });
  for (let i = 0; i < 6; i++) {
    const sv = dir.clone().multiplyScalar(2 + Math.random() * 3).add(new THREE.Vector3((Math.random() - 0.5) * 1.6, Math.random() * 1.2, (Math.random() - 0.5) * 1.6));
    puff(muzzle, { size: 0.5 + Math.random() * 0.4, life: 0.6 + Math.random() * 0.4, opacity: 0.7, grow: 2.4, vel: sv });
  }
  muzzleLight.intensity = 40;
  if (settings.ammo === 'limitli') ammo--;
  shotsThisLevel++;
  cooldown = 0.35; recoil = 1; domeSquash = 1; idle = 0;
  shake(0.12); buzz(12);
  $('hint').classList.add('gone');
  updateHud(); bump($('ammo'));
  sfx.fire();
}

canvas.addEventListener('pointerdown', e => {
  sfx.unlock();
  if (state !== 'playing' && state !== 'intro') return;
  aiming = true;
  try { canvas.setPointerCapture(e.pointerId); } catch {}
  updateAim(e.clientX, e.clientY);
});
canvas.addEventListener('pointermove', e => updateAim(e.clientX, e.clientY));
canvas.addEventListener('pointerup', e => {
  if (!aiming) return;
  aiming = false; dots.visible = false;
  updateAim(e.clientX, e.clientY);
  if (aimPoint) fire(aimPoint);
  if (e.pointerType !== 'mouse') reticle.visible = false;
});
canvas.addEventListener('pointercancel', () => { aiming = false; dots.visible = false; reticle.visible = false; });
canvas.addEventListener('pointerleave', e => { if (!aiming && e.pointerType === 'mouse') reticle.visible = false; });
document.addEventListener('click', e => { if (e.target.closest('button')) { sfx.unlock(); sfx.click(); } });

// ---------- settings ----------
const setLevel = $('setLevel');
setLevel.innerHTML = LEVELS.map((l, i) => `<option value="${i}">${i + 1}. ${l.name}</option>`).join('');
$('btnSettings').onclick = () => {
  setLevel.value = levelIndex;
  $('setSlots').value = settings.slots;
  $('setBall').value = settings.ball;
  $('setAmmo').value = settings.ammo;
  $('setSound').value = settings.sound ? 'on' : 'off';
  $('setShake').value = settings.shake ? 'on' : 'off';
  $('settings').hidden = false;
};
$('setCancel').onclick = () => { $('settings').hidden = true; };
$('settingsForm').addEventListener('submit', e => {
  e.preventDefault();
  settings.slots = +$('setSlots').value;
  settings.ball = $('setBall').value;
  settings.ammo = $('setAmmo').value;
  settings.sound = $('setSound').value === 'on';
  settings.shake = $('setShake').value === 'on';
  $('settings').hidden = true;
  buildSlots();
  loadLevel(+setLevel.value);
});

// ---------- loop ----------
function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  if (!w || !h) return;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  const k = Math.min(2.1, Math.max(1, 1.15 / camera.aspect));
  camBase.copy(LOOK).addScaledVector(CAM_OFFSET, k);
  camera.position.copy(camBase);
  camera.lookAt(LOOK);
  camera.updateProjectionMatrix();
  layoutTray();
}
window.addEventListener('resize', resize);
new ResizeObserver(resize).observe(stage);

const elasticOut = x => x <= 0 ? 0 : x >= 1 ? 1 : Math.pow(2, -10 * x) * Math.sin((x * 10 - 0.75) * (2 * Math.PI) / 3) + 1;
let last = performance.now();
function frame(now) {
  const rdt = Math.min(0.05, (now - last) / 1000);
  last = now;
  clock += rdt;
  // hit-stop: physics briefly crawls on a big impact, then eases back to full speed
  if (slowmo > 0) { slowmo -= rdt; timeScale = 0.15; }
  else timeScale += (1 - timeScale) * Math.min(1, rdt * 9);
  const dt = rdt * timeScale;

  if (state === 'intro') {
    introT += rdt;
    if (introT >= introEnd) state = 'playing';
  }
  world.step(1 / 120, dt, 8);
  cooldown -= rdt;

  for (const c of cubes) {
    if (c.collected) continue;
    c.mesh.position.copy(c.body.position);
    c.mesh.quaternion.copy(c.body.quaternion);
    if (introT < c.delay + 0.6) {
      const k = THREE.MathUtils.clamp((introT - c.delay) / 0.5, 0, 1);
      if (k > 0 && !c.appeared) { c.appeared = true; sfx.spawn(); }
      c.mesh.scale.setScalar(Math.max(0.001, elasticOut(k)));
      c.mesh.position.y += (1 - (1 - Math.pow(1 - k, 3))) * 1.4;
    } else if (c.mesh.scale.x !== 1) c.mesh.scale.setScalar(1);
    if (c.flash > 0) { c.flash = Math.max(0, c.flash - rdt * 6); c.mesh.material.emissiveIntensity = c.flash * 0.7; }
    if (c.body.position.y < COLLECT_Y) collect(c);
  }
  for (let i = balls.length - 1; i >= 0; i--) {
    const b = balls[i];
    b.age += dt;
    b.mesh.position.copy(b.body.position);
    b.mesh.quaternion.copy(b.body.quaternion);
    b.hist.unshift(b.mesh.position.clone());
    if (b.hist.length > b.trail.length) b.hist.pop();
    const speed = b.body.velocity.length();
    const fade = THREE.MathUtils.clamp((speed - 3) / 12, 0, 1);
    b.trail.forEach((s, k) => {
      const p = b.hist[Math.min(k, b.hist.length - 1)];
      s.position.copy(p);
      s.scale.setScalar(b.r * 2.2 * (1 - k / b.trail.length));
      s.material.opacity = 0.45 * fade * (1 - k / b.trail.length);
    });
    const slow = speed * speed < 0.09;
    if (b.body.position.y < -12 || b.age > 6 || (slow && b.age > 1.8)) { removeBall(b); balls.splice(i, 1); }
  }
  updateParticles(dt);
  updateFlights(rdt);
  drawDots(rdt);

  // out of ammo: wait for the scene to settle, then fail if cubes remain
  if (state === 'playing' && settings.ammo === 'limitli' && ammo <= 0 && balls.length === 0 && cubesLeft > 0) {
    const moving = cubes.some(c => !c.collected && c.body.velocity.lengthSquared() > 0.05);
    idle = (moving || flights.length) ? 0 : idle + rdt;
    if (idle > 1.5) lose('ammo');
  }

  // cannon
  pivot.quaternion.slerp(desiredQ, 1 - Math.exp(-rdt * 18));
  recoil = Math.max(0, recoil - rdt * 4);
  barrel.position.z = -Math.sin(Math.min(1, recoil) * Math.PI * 0.5) * 0.4;
  domeSquash = Math.max(0, domeSquash - rdt * 5);
  dome.scale.set(1 + domeSquash * 0.12, 1 - domeSquash * 0.18, 1 + domeSquash * 0.12);
  muzzleLight.intensity *= Math.exp(-rdt * 22);
  if (reticle.visible) reticle.scale.setScalar(1 + Math.sin(clock * 7) * 0.1);

  // sky
  for (const c of clouds) { c.position.x += c.userData.speed * rdt; if (c.position.x > 48) c.position.x = -48; }
  for (const f of farIslands) f.position.y = f.userData.y + Math.sin(clock * 0.6 + f.userData.phase) * 0.35;

  // camera shake
  shakeAmt *= Math.exp(-rdt * 9);
  camera.position.set(
    camBase.x + (Math.random() - 0.5) * shakeAmt,
    camBase.y + (Math.random() - 0.5) * shakeAmt,
    camBase.z + (Math.random() - 0.5) * shakeAmt * 0.5
  );
  camera.lookAt(LOOK);

  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

function start(data = {}) {
  if (data.settings) Object.assign(settings, data.settings);
  buildSlots();
  resize();
  loadLevel(Math.min(data.level ?? 0, LEVELS.length - 1));
  requestAnimationFrame(frame);
}
const hot = window.claude?.hot;
try { hot?.snapshot?.(() => ({ level: levelIndex, settings: { ...settings } })); } catch {}
hot?.ready ? hot.ready(start) : start(hot?.data ?? {});
</script>
</body></html>
